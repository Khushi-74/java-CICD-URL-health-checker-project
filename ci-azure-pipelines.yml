# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: Maven@4
  displayName: 'Building the code'

  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17' 
    jdkArchitectureOption: 'x64'
    goals: 'clean package'

- task: PublishBuildArtifacts@1
  displayName: 'Publishing artifacts'
  inputs:
    PathtoPublish: 'target'
    ArtifactName: 'java-artifact'
    publishLocation: 'Container'

- task: Docker@2
  displayName: Build and push docker images to docker hub repository
  inputs:
    containerRegistry: 'dockerhub-connection'
    repository: 'khushiships/url-health-checker-dockerhub'
    command: 'buildAndPush'
    Dockerfile: 'Dockerfile'
    tags: |
      latest
      $(Build.BuildId)

- task: SSH@0
  displayName: 'Deploy to Azure VM'
  inputs:
    sshEndpoint: 'azure-vm-ssh'
    runOptions: 'commands'
    commands: |
      docker pull khushiships/url-health-checker-dockerhub:latest

      docker stop url-health-checker || true

      docker rm url-health-checker || true

      docker run -d --restart unless-stopped --name url-health-checker -p 8080:8080 khushiships/url-health-checker-dockerhub:latest